<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Host+Grotesk:wght@400;500;700;900&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0A0A0A;
            color: #EAEFEA;
            line-height: 1.6;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        .font-host { font-family: 'Host Grotesk', sans-serif; }
        
        .background-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .background-glow::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: #A6FEB6;
            border-radius: 50%;
            filter: blur(250px);
            opacity: 0.08;
            bottom: -100px;
            right: -100px;
        }
        .background-glow::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: #FEA6A6;
            border-radius: 50%;
            filter: blur(200px);
            opacity: 0.05;
            top: -100px;
            left: -100px;
        }

        #noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        #noise-overlay::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            filter: url(#noiseFilter);
            opacity: 0.15;
            animation: noise-jitter 0.2s infinite steps(2);
        }

        @keyframes noise-jitter {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-1%, -1%); }
            20% { transform: translate(-2%, 1%); }
            30% { transform: translate(1%, -2%); }
            40% { transform: translate(-1%, 3%); }
            50% { transform: translate(-2%, 1%); }
            60% { transform: translate(3%, 0); }
            70% { transform: translate(0, 2%); }
            80% { transform: translate(-3%, 0); }
            90% { transform: translate(2%, 1%); }
            100% { transform: translate(1%, 0); }
        }

        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="noise-overlay"></div>
    <div class="background-glow"></div>

    <svg style="display: none;">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
        </filter>
    </svg>

    <main class="text-center px-6 fade-in">
        <div class="relative inline-block">
            <h1 class="text-[180px] font-host font-black text-gray-600 leading-[180px] opacity-20 select-none">404</h1>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <p class="text-base font-host font-medium text-[#EAEFEA] uppercase tracking-widest max-w-xs mx-auto">
                    Кажется, эта ссылка ведет в бессознательное
                </p>
            </div>
        </div>
        <div class="mt-12">
            <a href="/" class="inline-flex items-center gap-3 px-8 py-4 rounded-full bg-[#FEA6A6] text-black font-bold text-sm uppercase tracking-widest hover:bg-white transition-all duration-500 group">
                вернуться на главную
                <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                </svg>
            </a>
        </div>
    </main>

    <script>
        // Subtle mouse movement for the glow
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            document.querySelector('.background-glow').style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
